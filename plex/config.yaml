---
name: Plex Media Server
version: dev
slug: plex
description: Recorded media, live TV, online news, and podcasts ready to stream.
url: https://github.com/hassio-addons/app-plex
webui: http://[HOST]:[PORT:32400]/web
startup: services
init: false
arch:
  - aarch64
  - amd64
map:
  - media:rw
  - share:rw
  - ssl
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/vchiq
ports:
  3005/tcp: 3005
  8324/tcp: 8324
  32400/tcp: 32400
  32410/udp: 32410
  32412/udp: 32412
  32413/udp: 32413
  32414/udp: 32414
  32469/tcp: 32469
  1900/udp: null
  32470/tcp: null
ports_description:
  1900/udp: Optional Plex DLNA proxy discovery
  3005/tcp: Plex Home Theater via Plex Companion
  8324/tcp: Plex for Roku via Plex Companion
  32400/tcp: Plex Media Server Interface
  32410/udp: GDM network discovery
  32412/udp: GDM network discovery
  32413/udp: GDM network discovery
  32414/udp: GDM network discovery
  32469/tcp: Plex DLNA Server
  32470/tcp: Optional Plex DLNA proxy
hassio_api: true
backup_exclude:
  - "**/Plex Media Server/Cache/**"
  - "**/Plex Media Server/Plug-in Support/Caches/**"
  - "**/Plex Media Server/Logs/**"
  - "**/Plex Media Server/Crash Reports/**"
  - "**/Plex Media Server/Diagnostics/**"
  - "**/Plex Media Server/Media/**"
  - "**/Plex Media Server/Metadata/**"
options:
  claim_code: ""
  dlna_proxy_enabled: false
  dlna_proxy_backend_url: http://127.0.0.1:32469
  dlna_proxy_advertise_ip: ""
  dlna_proxy_port: 32470
  dlna_proxy_friendly_name: Plex DLNA Proxy
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  claim_code: str
  dlna_proxy_enabled: bool
  dlna_proxy_backend_url: url
  dlna_proxy_advertise_ip: str
  dlna_proxy_port: port
  dlna_proxy_friendly_name: str
